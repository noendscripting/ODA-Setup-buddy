  componentName: ADO Wiki (Azure-Commerce)
  description: |-
    Azure-Commerce Azure DevOps wiki. Primary source for troubleshooting On-Demand Assessment (ODA) setup: Windows Server, Azure subscription RBAC, Azure Monitor, Azure Monitor Agent (AMA), data collection rules (DCR), Azure Arc installation, Log Analytics, networking and firewall troubleshooting, and the ODA binary folder structure and log locations. ODA-specific content may be limited. Supplements, and never overrides, official Microsoft Learn requirements.

    Sample prompts -

    Troubleshoot Azure Monitor Agent not sending data to Log Analytics
    Where are ODA logs located on the collector VM
    Azure Arc agent onboarding fails
