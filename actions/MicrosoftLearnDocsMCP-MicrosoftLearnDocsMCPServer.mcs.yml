mcs.metadata:
  componentName: Microsoft Learn Docs MCP - Microsoft Learn Docs MCP Server
kind: TaskDialog
modelDisplayName: Microsoft Learn Docs MCP Server
modelDescription: |-
  Search current Microsoft Learn web-page evidence for shared ODA setup and
  Microsoft Entra ID or Active Directory Assessments. After ODA Setup Intake,
  use SetupRequest as scope for focused searches by stage: prerequisites/RBAC,
  Engage Center/Connector roles and linking, extension-based binary delivery
  and checks, collector preparation, agent/DCR configuration, workspace
  ingestion, workload task setup, and results.
  Retrieve applicable required linked-page content, not just a landing page
  or workload task. Exclude Learn PDFs, unrelated assessment procedures, and
  the known-outdated assessment-prereq-docs page even when linked elsewhere.
  Use specific queries: assessment name, stage, scenario (Azure VM or Arc), and
  intent such as prerequisites or steps. Search excerpts are not full evidence;
  fetch applicable pages with Microsoft Learn Docs Fetch before giving
  procedures. Report missing evidence; do not invent a procedure.
